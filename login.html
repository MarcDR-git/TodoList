<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bienvenido - Registro de Perfil</title>
<style>
  :root {
    --primary: #6366f1;
    --primary-dark: #4f46e5;
    --bg-gradient: linear-gradient(-45deg, #6366f1, #a855f7, #ec4899, #22d3ee);
    --text-muted: #6b7280;
  }

  body { 
    margin: 0;
    display: flex; 
    justify-content: center; 
    align-items: center; 
    min-height: 100vh; 
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg-gradient);
    background-size: 400% 400%;
    animation: gradientBG 15s ease infinite;
    overflow-x: hidden;
  }

  @keyframes gradientBG {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .card { 
    background: rgba(255, 255, 255, 0.95); 
    backdrop-filter: blur(10px);
    color: #1f2937; 
    padding: 30px; 
    border-radius: 28px; 
    text-align: center; 
    width: 90%; 
    max-width: 360px; 
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
    animation: scaleUp 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    margin: 20px 0;
  }

  @keyframes scaleUp {
    from { opacity: 0; transform: scale(0.9); }
    to { opacity: 1; transform: scale(1); }
  }

  h2 { 
    margin: 0 0 5px 0; 
    font-weight: 800; 
    font-size: 1.6rem;
    letter-spacing: -1px;
    color: #111827;
  }

  .subtitle {
    color: var(--text-muted);
    font-size: 14px;
    margin-bottom: 20px;
  }

  /* Estilo para la foto de perfil */
  .avatar-container {
    position: relative;
    width: 100px;
    height: 100px;
    margin: 0 auto 20px;
    cursor: pointer;
  }

  .avatar-preview {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: #f3f4f6;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    border: 3px solid white;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    transition: 0.3s;
  }

  .avatar-preview img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .avatar-preview:hover {
    transform: scale(1.05);
    border-color: var(--primary);
  }

  .upload-hint {
    position: absolute;
    bottom: 0;
    right: 0;
    background: var(--primary);
    color: white;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    border: 2px solid white;
  }

  .input-group {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 20px;
  }

  input, textarea { 
    width: 100%; 
    padding: 12px 16px; 
    border-radius: 12px; 
    border: 2px solid #f3f4f6; 
    background: #f9fafb; 
    box-sizing: border-box;
    font-family: inherit;
    font-size: 15px;
    transition: all 0.3s;
  }

  textarea {
    resize: none;
    height: 80px;
  }

  input:focus, textarea:focus {
    outline: none;
    border-color: var(--primary);
    background: rgb(85, 84, 84);
  }

  .row {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 10px;
  }

  .privacy-notice {
    font-size: 11px;
    color: #9ca3af;
    margin-bottom: 20px;
    line-height: 1.4;
  }

  button { 
    padding: 14px; 
    width: 100%; 
    border: none; 
    border-radius: 14px; 
    background: var(--primary); 
    color: white; 
    font-weight: 700;
    font-size: 16px;
    cursor: pointer;
    transition: all 0.3s;
    box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
  }

  button:hover {
    background: var(--primary-dark);
    transform: translateY(-2px);
  }

  @media (prefers-color-scheme: dark) {
    .card { background: rgba(30, 30, 30, 0.95); color: white; }
    h2 { color: white; }
    input, textarea { background: #2d2d2d; border-color: #3f3f46; color: white; }
    .subtitle { color: #9ca3af; }
    .avatar-preview { background: #3f3f46; }
  }
</style>
</head>
<body>

<div class="card">
  <h2 id="greeting">Bienvenido</h2>
  <p class="subtitle">Crea tu perfil para comenzar</p>
  
  <div class="avatar-container" onclick="document.getElementById('avatarInput').click()">
    <div class="avatar-preview" id="avatarPreview">
      <span style="font-size: 40px;" id="placeholderIcon">👤</span>
    </div>
    <div class="upload-hint">📷</div>
    <input type="file" id="avatarInput" hidden accept="image/*" onchange="previewImage(event)">
  </div>

  <div class="input-group">
    <div class="row" style="grid-template-columns: 1fr 1fr;">
        <input id="name" placeholder="Tu nombre" autocomplete="off" />
        <input id="birthdate" type="date" title="Fecha de nacimiento" />
    </div>
    <textarea id="desc" placeholder="Breve descripción sobre ti..."></textarea>
  </div>
  
  <p class="privacy-notice">
    🔒 <b>Aviso de privacidad:</b> Toda tu información se guarda localmente en tu dispositivo. No será compartida ni subida a ningún servidor externo.
  </p>

  <button onclick="saveProfile()">Comenzar</button>
</div>

<script>
  // Saludo según la hora
  const hour = new Date().getHours();
  const greetingEl = document.getElementById('greeting');
  if (hour < 12) greetingEl.innerText = "¡Buenos días!";
  else if (hour < 18) greetingEl.innerText = "¡Buenas tardes!";
  else greetingEl.innerText = "¡Buenas noches!";

  let base64Avatar = "";

  function previewImage(event) {
    const reader = new FileReader();
    reader.onload = function() {
      const output = document.getElementById('avatarPreview');
      output.innerHTML = `<img src="${reader.result}">`;
      base64Avatar = reader.result;
    };
    reader.readAsDataURL(event.target.files[0]);
  }

  function saveProfile(){
    const name = document.getElementById('name').value.trim();
    const birthdate = document.getElementById('birthdate').value;
    const desc = document.getElementById('desc').value.trim();
    
    if(name && birthdate){
      // Guardar información en LocalStorage
      localStorage.setItem('username', name);
      localStorage.setItem('user_birthdate', birthdate); // Guardamos la fecha de nacimiento
      localStorage.setItem('user_desc', desc);
      if(base64Avatar) localStorage.setItem('user_avatar', base64Avatar);

      // Efecto de salida y recarga
      document.querySelector('.card').style.opacity = '0';
      document.querySelector('.card').style.transform = 'scale(0.9)';
      document.querySelector('.card').style.transition = '0.3s';
      
      setTimeout(() => {
        parent.location.reload();
      }, 300);
    } else {
      const inputs = [document.getElementById('name'), document.getElementById('birthdate')];
      inputs.forEach(input => {
        if(!input.value) input.style.borderColor = '#ef4444';
      });
    }
  }
</script>
</body>
</html>
